name: Release binaries

# All 5 platform binaries are built on a single ubuntu-latest runner via cross-compilation
# (see scripts/build-binaries.sh) — no OS matrix needed, @opentui/core's per-platform native
# libraries are just swapped in with `bun install --os=X --cpu=Y` before each compile.
on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install

      - name: Build all platform binaries
        run: bash scripts/build-binaries.sh

      - name: Smoke test the linux binary this runner can actually execute
        run: |
          chmod +x release/aeon-linux-x64
          ./release/aeon-linux-x64 --help

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/aeon-*
          generate_release_notes: true
